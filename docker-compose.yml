services:
  postgres:
    image: postgres:16-alpine
    container_name: eduagent_database
    environment:
      POSTGRES_DB: eduagent
      POSTGRES_USER: test
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pg_data: