services:
  postgres:
    image: postgres:16-alpine
    container_name: eduagent_database
    environment:
      POSTGRES_DB: eduagent
      POSTGRES_USER: test
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d eduagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: ghcr.io/tanh8805/eduagentbackend:latest
    container_name: eduagent_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USERNAME=test
      - DB_PASSWORD=123456
      - FASTAPI_URI=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    image: ghcr.io/tanh8805/eduagentpythonservice:latest
    container_name: eduagent_ai_service
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql://test:123456@postgres:5432/eduagent
      - DB_URI=postgresql://test:123456@postgres:5432/eduagent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data: